name: MapOverlay
options:
  bundleIdPrefix: com.qinbang
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: "10.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
targets:
  MapOverlay:
    type: application
    platform: iOS
    sources:
      - MapOverlay
    settings:
      base:
        INFOPLIST_FILE: MapOverlay/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.qinbang.MapOverlay
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: GoogleMaps
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
