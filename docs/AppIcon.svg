<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00897B;stop-opacity:1" />
    </linearGradient>
    <!-- Overlay gradient -->
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7043;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#FF5722;stop-opacity:0.85" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="smallShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Map grid lines (subtle) -->
  <g opacity="0.15" stroke="white" stroke-width="2" fill="none">
    <!-- Horizontal lines -->
    <line x1="100" y1="280" x2="924" y2="280"/>
    <line x1="100" y1="440" x2="924" y2="440"/>
    <line x1="100" y1="600" x2="924" y2="600"/>
    <line x1="100" y1="760" x2="924" y2="760"/>
    <!-- Vertical lines -->
    <line x1="260" y1="100" x2="260" y2="924"/>
    <line x1="430" y1="100" x2="430" y2="924"/>
    <line x1="600" y1="100" x2="600" y2="924"/>
    <line x1="770" y1="100" x2="770" y2="924"/>
  </g>

  <!-- Map path/road (curved line) -->
  <path d="M 180 750 Q 350 500 420 550 Q 500 600 550 400 Q 620 200 780 320"
        stroke="white" stroke-width="6" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Overlay image rectangle (tilted, semi-transparent) -->
  <g filter="url(#shadow)">
    <rect x="280" y="250" width="480" height="340" rx="16" ry="16"
          fill="url(#overlay)" transform="rotate(-6, 520, 420)"/>
  </g>

  <!-- Corner handles on the overlay -->
  <g fill="white" filter="url(#smallShadow)">
    <circle cx="290" cy="258" r="14" transform="rotate(-6, 520, 420)"/>
    <circle cx="750" cy="258" r="14" transform="rotate(-6, 520, 420)"/>
    <circle cx="290" cy="582" r="14" transform="rotate(-6, 520, 420)"/>
    <circle cx="750" cy="582" r="14" transform="rotate(-6, 520, 420)"/>
  </g>
  <!-- Corner handle borders -->
  <g fill="none" stroke="#2196F3" stroke-width="3">
    <circle cx="290" cy="258" r="14" transform="rotate(-6, 520, 420)"/>
    <circle cx="750" cy="258" r="14" transform="rotate(-6, 520, 420)"/>
    <circle cx="290" cy="582" r="14" transform="rotate(-6, 520, 420)"/>
    <circle cx="750" cy="582" r="14" transform="rotate(-6, 520, 420)"/>
  </g>

  <!-- Map pin -->
  <g filter="url(#smallShadow)" transform="translate(680, 620)">
    <path d="M 0 -60 C -33 -60 -55 -38 -55 -12 C -55 25 0 70 0 70 C 0 70 55 25 55 -12 C 55 -38 33 -60 0 -60 Z"
          fill="#F44336"/>
    <circle cx="0" cy="-16" r="18" fill="white"/>
  </g>

  <!-- Layer stack icon (bottom-left) -->
  <g transform="translate(180, 700)" opacity="0.9" filter="url(#smallShadow)">
    <rect x="0" y="0" width="80" height="55" rx="8" fill="white" opacity="0.5" transform="rotate(-8, 40, 27)"/>
    <rect x="8" y="-10" width="80" height="55" rx="8" fill="white" opacity="0.7" transform="rotate(-4, 48, 17)"/>
    <rect x="16" y="-20" width="80" height="55" rx="8" fill="white" opacity="0.9"/>
  </g>
</svg>
